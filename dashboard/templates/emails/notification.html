<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .header { font-size: 1.2em; margin-bottom: 1em; }
    .message { margin: 1em 0; }
    .footer { font-size: 0.8em; color: #666; margin-top: 2em; border-top: 1px solid #eee; padding-top: 1em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">{{ notification.title }}</div>
    <div class="message">{{ notification.message }}</div>
    <div class="footer">
      <p>Time: {{ notification.created_at.strftime('%Y-%m-%d %H:%M:%S UTC') }}</p>
      <p><a href="{{ link }}">View in dashboard</a></p>
    </div>
  </div>
</body>
</html>
