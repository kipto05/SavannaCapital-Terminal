{# Modal Component
   A modal dialog with header, body, footer and close capability.
   Usage: {% include "v3/partials/_modal.html" with id="trade-modal" title="Execute Trade" %}
#}
<div id="{{ id or 'modal' }}" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden" role="dialog" aria-modal="true">
  <div class="bg-surface border border-outline-variant rounded-lg w-full max-w-lg mx-4 shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-outline-variant">
      <h3 class="font-display text-lg font-semibold text-on-surface">{{ title or 'Modal' }}</h3>
      <button type="button" onclick="document.getElementById('{{ id or 'modal' }}').classList.add('hidden')" class="text-on-surface opacity-70 hover:opacity-100 transition-opacity" aria-label="Close modal">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-4 max-h-[70vh] overflow-y-auto custom-scrollbar">
      {% block modal_body %}{% endblock %}
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end space-x-3 px-6 py-4 border-t border-outline-variant bg-surface-container">
      <button type="button" onclick="document.getElementById('{{ id or 'modal' }}').classList.add('hidden')" class="px-4 py-2 font-label text-sm text-on-surface border border-outline-variant rounded hover:bg-surface-container-high transition-colors">
        Cancel
      </button>
      {% block modal_actions %}{% endblock %}
    </div>
  </div>
</div>
